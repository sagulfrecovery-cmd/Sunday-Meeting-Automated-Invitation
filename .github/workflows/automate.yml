name: Fellowship Daily Global Engine

on:
  schedule:
    # Runs EVERY DAY at 6:00 AM UTC (9:00 AM Baghdad time)
    - cron: '0 6 * * *'
  workflow_dispatch: 

jobs:
  run-daily-robot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install pandas gspread oauth2client pytz

      - name: Run Daily Robot
        env:
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        run: python daily_robot.py
